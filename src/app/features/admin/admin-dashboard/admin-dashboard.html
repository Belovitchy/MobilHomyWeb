<div class="space-y-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-ink">Tableau de bord</h1>
      <p class="mt-1 text-sm text-soft">Bon fonctionnement de la plateforme MobilHomy.</p>
    </div>
    <a
      routerLink="/admin/owners"
      class="rounded-lg border border-line bg-white px-4 py-2 text-sm font-medium text-ink hover:bg-surface"
      >Gérer les propriétaires</a
    >
  </div>

  @if (error()) {
    <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-600">
      {{ error() }}
    </div>
  }
  @if (loading()) {
    <p class="text-sm text-soft">Chargement…</p>
  }

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (t of tiles(); track t.label) {
      <div
        class="rounded-xl border bg-white p-4"
        [class.border-line]="!t.alert"
        [class.border-amber-300]="t.alert"
        [attr.data-tile]="t.label"
      >
        <p class="text-xs font-medium tracking-wide text-soft uppercase">{{ t.label }}</p>
        <p class="mt-1 text-2xl font-semibold text-ink">{{ t.value }}</p>
        @if (t.hint) {
          <p class="mt-1 text-xs" [class.text-soft]="!t.alert" [class.text-amber-700]="t.alert">
            {{ t.hint }}
          </p>
        }
      </div>
    }
  </div>
</div>
