<div class="flex min-h-screen items-center justify-center bg-surface px-4">
  <div class="w-full max-w-sm rounded-xl border border-line bg-white p-8 shadow-sm">
    <h1 class="text-center text-2xl font-bold text-ink">
      Mobil<span class="text-accent">Homy</span>
    </h1>

    <!-- Tabs (maquette 04) -->
    <div class="mt-4 grid grid-cols-2 border-b border-line text-center text-sm">
      <a routerLink="/login" class="py-2 text-soft hover:text-accent">Connexion</a>
      <a class="border-b-2 border-accent pb-2 font-semibold text-accent">Créer un compte</a>
    </div>

    <p class="mt-4 text-center text-xs text-soft">
      Un compte est requis uniquement pour réserver — la consultation reste libre.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1 block text-xs text-soft" for="firstname">Prénom</label>
          <input
            id="firstname"
            formControlName="firstname"
            [class]="inputClasses(isInvalid('firstname'))"
          />
        </div>
        <div>
          <label class="mb-1 block text-xs text-soft" for="name">Nom</label>
          <input id="name" formControlName="name" [class]="inputClasses(isInvalid('name'))" />
        </div>
      </div>

      <div>
        <label class="mb-1 block text-xs text-soft" for="email">Email (identifiant)</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [class]="inputClasses(isInvalid('email'))"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs text-soft" for="phone">Téléphone (optionnel)</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="06 12 34 56 78"
          class="w-full rounded-lg border border-line px-3 py-2 text-sm outline-none focus:border-accent"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs text-soft" for="password"
          >Mot de passe (min. 8 caractères)</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          [class]="inputClasses(isInvalid('password'))"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs text-soft" for="confirm">Confirmer le mot de passe</label>
        <input
          id="confirm"
          type="password"
          formControlName="confirm"
          [class]="inputClasses(isInvalid('confirm'))"
        />
        @if (mismatch()) {
          <p class="mt-1 text-xs text-red-600">Les mots de passe ne correspondent pas.</p>
        }
      </div>

      @if (error()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-accent py-2 text-sm font-semibold text-white hover:opacity-90 disabled:opacity-50"
      >
        {{ loading() ? 'Création…' : 'Créer mon compte' }}
      </button>
    </form>
  </div>
</div>
